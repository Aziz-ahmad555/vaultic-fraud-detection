# Local services. Phase 0: PostgreSQL only; Kafka, Redis, API, scorer, MLflow and the
# dashboard are added in Phase 11.
# Start:  docker compose up -d      (needs POSTGRES_PASSWORD in .env; see .env.example)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultic}
      POSTGRES_USER: ${POSTGRES_USER:-vaultic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # localhost only; 55432 by default because a native PostgreSQL may already use 5432
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
