# Vaultic platform services (Sprint 3, D231; scope D230). The API and the dashboard run on the host;
# only PostgreSQL, Redis and Kafka run here. Every port is bound to 127.0.0.1 and set in .env, and the
# project name and volumes are 'vaultic', so this stack runs beside other compose projects (for
# example one using 5433 and 6379) without clashes. See docs/PLATFORM.md.
#
#   docker compose up -d                      PostgreSQL (the default service)
#   docker compose --profile cache up -d      + Redis (3.4, D244): response and session cache
#   docker compose --profile stream up -d     + Kafka (3.5, D245): replay and stream scoring
#   docker compose --profile full up -d       + Redis + Kafka
#   python -m vaultic.infra.db migrate        apply services/db/migrations
#
# Needs POSTGRES_PASSWORD in .env (see .env.example).
name: vaultic

services:
  postgres:
    # exact tag pinned to its digest (D231), as pulled on 2026-11-25
    image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultic}
      POSTGRES_USER: ${POSTGRES_USER:-vaultic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5442 by default (D231 amends D14's 55432); POSTGRES_PORT is still read as a fallback
      - "127.0.0.1:${VAULTIC_POSTGRES_PORT:-${POSTGRES_PORT:-5442}}:5432"
    volumes:
      - vaultic-postgres:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no restart policy (D233): Vaultic's PostgreSQL starts only with `docker compose up`

  redis:
    # Redis 7.4.11, pinned to the digest of the image already on this machine (D244: no download).
    # A cache only: no RDB, no AOF, so no volume; PostgreSQL stays the source of truth for sessions.
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    profiles: ["cache", "full"]
    entrypoint: ["sh", "-c"]
    command:
      - >-
        exec redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save "" --appendonly no
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${VAULTIC_REDIS_PORT:-6390}:6379"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    # no restart policy (D233)

  kafka:
    # Apache Kafka 4.4.0, single node in KRaft mode (D245), pinned to its digest (pulled 2026-11-27).
    # Topics tx.raw, tx.scored, alerts and feedback (1 partition each) are created by the replay
    # (python -m vaultic.infra.replay); auto-creation is off.
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    profiles: ["stream", "full"]
    environment:
      CLUSTER_ID: vaultic-kraft-cluster-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # EXTERNAL: the host listener (127.0.0.1 only); INTERNAL: the compose network only
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9094,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${VAULTIC_KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "127.0.0.1:${VAULTIC_KAFKA_PORT:-9094}:9094"
    volumes:
      - vaultic-kafka:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    # no restart policy (D233)

volumes:
  vaultic-postgres:
    name: vaultic-postgres
  vaultic-kafka:
    name: vaultic-kafka
