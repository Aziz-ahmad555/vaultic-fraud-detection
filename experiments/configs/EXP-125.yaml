# only training labels already known when validation starts: its_time + L <= start of the
# validation period, L = 30 days. Measures how much label delay costs at training time.
# Features are unchanged (point-in-time as before); only training rows are dropped
# (harness option train_label_maturity_days). Same parameters as B5 on purpose: the comparison
# isolates the label set, so there is no retuning (research/decisions.md D39).
