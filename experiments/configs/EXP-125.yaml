  - "Aziz's go-ahead"
extends: EXP-009.yaml
question: "E25: B5 trained without labels from the last 30 days before validation starts"
train_label_maturity_days: 30
compare_to: [EXP-009]
report:
  overall: [pr_auc, roc_auc, recall_at_1pct_fpr]
  statistics: {paired_bootstrap: true, effect_size: true}
