# Time-based splits: the single definition every experiment uses.
# day = TransactionDT // 86400; the IEEE-CIS training data covers days 1-182
# (research/data_report.md). Day ranges are inclusive.

uid_variant: uid         # chosen on validation PR-AUC, see research/decisions.md D18
label_delay_days: 30     # a past label is usable at time t only if its_time + 30 days <= t

fixed:
  train: [1, 120]
  # days 121-127: 7-day gap, used by no split
  validation: [128, 150]
  # validation tail, never fusion-gate training (D53), split in time (review N1, D76):
  #   calibrate_views  per-view calibrators only (255 frauds in 8,376 rows)
  #   calibrate_fused  fused calibration, conformal calibration, decision thresholds and
  #                    routing lambdas only (300 frauds in 10,276 rows)
  calibrate_views: [144, 146]
  calibrate_fused: [147, 150]
  test: [151, 182]       # final runs only; never used for any choice

# Cross-fitted out-of-time view predictions for the fusion gate (D95): expanding windows over
# the training period; each fold is one set of view models predicting the next block. Used by
# views/plan.crossfit_plan together with the fixed fold (1-120 -> validation).
gate_folds:
  - {train: [1, 30], predict: [31, 60]}
  - {train: [1, 60], predict: [61, 90]}
  - {train: [1, 90], predict: [91, 120]}

# Drift work (Phase 10): grow the training window by 30-day blocks, test on the next block.
rolling:
  - {train: [1, 90], test: [91, 120]}
  - {train: [1, 120], test: [121, 150]}
  - {train: [1, 150], test: [151, 182]}
