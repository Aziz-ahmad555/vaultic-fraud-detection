# Paper 2 final experiments E10, E11, E12, pre-registered in research/decisions.md D101
# (implementation details D102). Run ONLY with `python -m vaultic.fusion.final_run --mode final`
# after Aziz's go-ahead; frozen and hashed in research/frozen_final.md (the run refuses to start
# if any frozen file changed). Not a harness config: vaultic.eval.run refuses it.
id: EXP-200-final
status: frozen-final
question: "Paper 2 final: E10 fusion comparison, E11 view-removal robustness, E12 trust layer (D101)"
pipeline: "D95, unchanged: cross-fitted plan, tuned views, calibrate_views 144-146, calibrate_fused 147-150"
views: [tabular, behavioral, temporal, graph, anomaly]   # tuned configs EXP-V-<view>.yaml
fusion_params: research/tables/fusion_d95.json            # D95-tuned MVAF / F3-F7 settings (not re-tuned)
b5_config: EXP-009                                         # B5, frozen Phase 2 model
b5_run: experiments/runs/EXP-009/20261008-211052-888539    # stored B5 test predictions (sanity check)
f0_config: EXP-F0-inner                                    # F0, the D95 version (tuned on 128-143)
seeds: [0, 1, 2, 3, 4]
bootstrap: {n: 1000, seed: 0}
e10:
  methods: [MVAF, F0, B5, F1, F2, F3, F4, F5, F6, F7]
  primary: "MVAF - F3 test PR-AUC, two-sided"
  secondary: ["MVAF vs F4", "MVAF vs F0", "MVAF vs B5"]
  metrics: [pr_auc, recall_at_1pct_fpr, cost]
  subgroups: [cold start / history, has_identity yes / no, graph view available yes / no, "available views 1-2 / 3-4 / 5"]
e11:
  conditions: [tabular, behavioral, temporal, graph, anomaly, tabular only]
  primary: "drop(MVAF) - drop(F3), drop(MVAF) - drop(F4); Holm across the 5 views"
e12_methods: [MVAF, F3, B5]
e12:
  conformal_targets: [0.90, 0.95]
  adaptive: {gamma: 0.05, block_days: 7, label_delay_days: 30}
  routing_k_per_day: [50, 100, 200, 500]
  lambda_grid: [0.0, 0.25, 0.5, 1.0, 2.0]
  phase8_gate_tolerance: 0.02
