# Roadmap E14 (RQ4, Paper 3): retraining policies and active learning. SHOULD scope (D31).
# This config is the all-history training window; the window is an experiment variable (D45).
id: EXP-114
roadmap: E14
scope: SHOULD
status: planned
needs:
  - "EXP-113 detectors; champion-challenger gate; label-delay simulator"
question: "E14: retraining policies P0-P3 and active-learning strategies"
retraining:
  policies: {P0: never, P1: monthly, P2: label_free_detector, P3: label_based_detector}
  champion_challenger:   # D45: significant gain, never a fixed margin
    window: most_recent_matured_labels
    pr_auc: {test: paired_bootstrap, alpha: 0.05, n_boot: 1000, require: "95% CI of gain > 0"}
    cost: not_worse
    retry: {every_days: 7, max_retries: 6}
  train_window_days: null   # all matured history; variants EXP-114-w45 / -w60 / -w90
active_learning:
  strategies: [random, uncertainty, disagreement, expected_loss]
  labels_per_day: [50, 100, 200, 500]
  horizon_months: 3
report:
  retraining: [pr_auc_over_time, total_cost, n_retrains]
  active_learning: [pr_auc_vs_labels, label_saving_at_equal_recall]
seeds: [0, 1, 2, 3, 4]
bootstrap: {n: 1000, seed: 0}
