# Roadmap E12 (RQ5, Paper 2): calibration, conformal coverage, routing.
# Phase 8 exit gate: conformal coverage within 2 points of target on test; routing for all K.
id: EXP-112
roadmap: E12
status: planned
needs:
  - "EXP-110 fused scores (MVAF)"
question: "E12: calibration, conformal coverage and budget-aware routing (RQ5, H5)"
uses: EXP-110
calibration: {methods: [isotonic, platt], choose_by: out_of_fold_ece, folds: 5, ece_bins: 15}
conformal:
  methods: [split, mondrian, adaptive]
  targets: [0.90, 0.95]
  calibration_slice: "a held-out, time-ordered slice of validation"
  adaptive: {report: monthly_coverage}
routing:
  policies: [R1, R2, R3, R4]
  k_per_day: [50, 100, 200, 500]
  lambdas_chosen_on: validation
report:
  calibration: [brier, ece, reliability_diagram]
  conformal: [coverage, share_uncertain]
  routing: [fraud_value_caught, fraud_count_caught, recall_at_k, money_saved_per_review]
seeds: [0, 1, 2, 3, 4]
# Review N2 (D77): every view's validation AND test predictions come from the one fixed-plan
# model set; calibration, conformal sets, thresholds and routing lambdas are fitted and applied
# only on that same fold (plan.check_calibration_scope). Rolling folds add earlier gate rows.
plan: {name: gate, calibration_scope: same_fold}
bootstrap: {n: 1000, seed: 0}
