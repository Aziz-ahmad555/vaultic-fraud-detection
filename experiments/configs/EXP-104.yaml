# Roadmap E4 (RQ1, Paper 2): + temporal view (GRU over the last N transactions).
# Ablation table row "+ temporal": behavioral yes, temporal yes, fusion = stacking (F4, D41).
id: EXP-104
roadmap: E4
status: planned
needs:
  - "GRU temporal view trained on the training period (views/temporal.py, .venv-torch)"
  - "out-of-sample temporal scores for validation and test (rolling scheme, D28)"
  - "stacking fusion in the harness (F4 LightGBM stacking, missing views as NaN)"
question: "E4: B5 + behavioral + temporal view (stacking) vs E3"
views:
  tabular: {experiment: EXP-103}
  temporal:
    model: gru
    n_steps: [10, 20]
    hidden: 32
    # D45 rule (deliberate deviation from roadmap Phase 5): early stopping on the latest 20% of
    # each fold's TRAINING rows, never on the predicted block, so gate inputs stay out-of-sample
    early_stopping: {metric: pr_auc, rows: latest_20pct_of_fold_training_rows}
fusion: {method: F4, missing_views: nan}   # LightGBM stacking (D41); F3 version: EXP-104-F3.yaml (appendix)
compare_to: [EXP-103]
report:
  overall: [pr_auc, roc_auc, recall_at_1pct_fpr]
  subgroups: {cold_start: "hist_n_past == 0", established: "hist_n_past >= 5"}
  statistics: {paired_bootstrap: true, holm: true, effect_size: true}
seeds: [0, 1, 2, 3, 4]
bootstrap: {n: 1000, seed: 0}
