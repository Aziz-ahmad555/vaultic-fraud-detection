# Roadmap E6 (RQ3, Paper 1): how much does temporal leakage inflate graph-based detection?
# A: all edges + all labels; B: all edges + delayed labels; C: past edges + delayed labels.
# A - B isolates label leakage, B - C edge (future-structure) leakage. Same model and budget.
id: EXP-106
roadmap: E6
status: planned
needs:
  - "graph features for the full data in all three settings (features/graph.py)"
  - "harness support for feature sets b5_graph_A / b5_graph_B / b5_graph_C"
question: "E6: graph leakage settings A / B / C (RQ3, H3: a static full graph inflates PR-AUC)"
model:
  name: xgboost
tuning: {method: optuna, trials: 50, per_setting: true}
features: b5_graph
graph:
  settings: [A, B, C]
  label_delay_days: 30
  window_days: 30
  label_delay_sweep: {settings: [B, C], days: [0, 7, 30, 60]}  # Paper 1: effect of label delay
compare: ["A vs C", "A vs B", "B vs C"]
report:
  overall: [pr_auc, roc_auc, recall_at_1pct_fpr]
  primary: "PR-AUC gap A - C with paired bootstrap CI"
  statistics: {paired_bootstrap: true, holm: true, effect_size: true}
seeds: [0, 1, 2, 3, 4]
bootstrap: {n: 1000, seed: 0}
